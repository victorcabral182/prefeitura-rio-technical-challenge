# 5s para os gráficos do k6 terem resolução; o custo é irrelevante com 3 alvos.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:3000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # Tamanho das filas medido pelo próprio broker (plugin rabbitmq_prometheus, já
  # ativo na imagem): continua disponível com o worker fora do ar, que é quando
  # a fila cresce. queue_coarse_metrics = mensagens prontas/sem ack por fila.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

rule_files:
  - alerts.yml
